name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # "<user>.github.io" repo -> served from "/", any other repo -> "/<repo>/".
      # For a custom domain, set the repository variable SITE_URL
      # (Settings -> Secrets and variables -> Actions -> Variables), e.g. https://example.com/
      - name: Compute base path and site URL
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          if [ -n "$CUSTOM_SITE_URL" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
            echo "SITE_URL=$CUSTOM_SITE_URL" >> "$GITHUB_ENV"
          elif [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "$OWNER.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://$OWNER.github.io/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$REPO/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://$OWNER.github.io/$REPO/" >> "$GITHUB_ENV"
          fi

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
