<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mórocz Hanna</title>
    <!-- Title, description and Open Graph tags are injected from src/content.ts (see vite.config.ts). -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fff5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f0d1a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Fonts: Fraunces (headings) + JetBrains Mono (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />

    <!-- Set theme and language before first paint to avoid a flash. Logic mirrors src/context/*. -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem('mh-theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          root.dataset.theme = theme;
          var lang = localStorage.getItem('mh-lang');
          if (lang !== 'hu' && lang !== 'en') {
            var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
            lang = 'en';
            for (var i = 0; i < list.length; i++) {
              var code = String(list[i]).toLowerCase();
              if (code.indexOf('hu') === 0) { lang = 'hu'; break; }
              if (code.indexOf('en') === 0) { lang = 'en'; break; }
            }
          }
          root.lang = lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ehhez az oldalhoz JavaScript szükséges. / This site requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
